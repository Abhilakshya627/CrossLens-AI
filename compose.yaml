name: crosslens

services:
  backend:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    command: uvicorn infrastructure.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "${CROSSLENS_API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    command: celery -A infrastructure.tasks.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["app"]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  chroma_data:
