[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crosslens-ai"
version = "0.1.0"
description = "A provenance-aware evidence intelligence platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6,<6",
    "fastapi>=0.118,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=7,<9",
    "uvicorn>=0.37,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["contracts*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
